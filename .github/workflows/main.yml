name: Gerar APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - uses: android-actions/setup-android@v3
        with:
          packages: ''

      - name: Extrair projeto
        run: |
          unzip -q ./*.zip -d projeto
          GRADLEW=$(find projeto -name gradlew | head -n 1)
          echo "PROJ=$(dirname "$GRADLEW")" >> $GITHUB_ENV

      - name: Compilar APK
        run: |
          cd "$PROJ"
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: AL-Canais-APK
          path: ${{ env.PROJ }}/app/build/outputs/apk/debug/*.apk
