
name: Gerar APK AL Canais V5

on:
  push:
    branches:
      - teste-melhorias-v1
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ''

      - name: Extrair projeto V5
        run: |
          ZIP="AL_Canais_V5_Categorias_Separadas.zip"

          if [ ! -f "$ZIP" ]; then
            echo "ERRO: Arquivo V5 nao encontrado!"
            exit 1
          fi

          echo "Compilando: $ZIP"

          mkdir -p projeto
          unzip -q "$ZIP" -d projeto

          GRADLEW=$(find projeto -name gradlew -type f | head -n 1)

          if [ -z "$GRADLEW" ]; then
            echo "ERRO: Projeto Gradle nao encontrado!"
            exit 1
          fi

          echo "PROJ=$(dirname "$GRADLEW")" >> "$GITHUB_ENV"

      - name: Compilar APK V5
        run: |
          cd "$PROJ"
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Publicar APK V5
        uses: actions/upload-artifact@v4
        with:
          name: AL-Canais-V5-APK
          path: ${{ env.PROJ }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
